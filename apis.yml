aid: iit-madras
name: Indian Institute of Technology Madras
description: >-
  Indian Institute of Technology Madras is a public institute of technology in Chennai, India,
  founded in 1959 and consistently ranked first in India's NIRF engineering rankings. It publishes no
  developer portal, no open data portal and no OpenAPI, AsyncAPI or other open specification of its
  own — api.iitm.ac.in does not resolve — but it is not empty, and the June 2026 profile that
  recorded "no APIs" missed the surfaces it does operate. Three are institution-run and machine
  readable: a Shibboleth SAML identity provider at idp.iitm.ac.in, registered in the INFLIBNET
  Access Management Federation (INFED) and flowing into eduGAIN since 2018; a self-hosted Moodle at
  courses.iitm.ac.in that serves a live, unauthenticated LTI 1.3 JWKS and an LTI Advantage token
  endpoint alongside the standard Moodle web-services REST server; and the Shoonya annotation
  platform API run by AI4Bharat, the institute's language-AI centre, which ships a live drf-yasg
  documentation surface over a credentialed Django REST API. IIT Madras is also a Crossref member
  (49493, prefix 10.70002) and holds ROR 03v0r5n49. Two further surfaces are real institutional facts
  running on someone else's platform and are recorded as tenancies, not as IIT Madras contracts: the
  online-degree Discourse forum, which CNAMEs to iitm.hosted-by-discourse.com, and the institute's
  IRINS research-profile instance at iitm.irins.org, operated by INFLIBNET. Everything callable here
  is credentialed; the institute's own institutional repository host, irepose.iitm.ac.in, no longer
  resolves at all.
type: Index
