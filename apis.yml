    x-operator: registry
    x-operator-basis: >-
      api.crossref.org is an identifier registry IIT Madras is registered in, not a vendor platform
      running under its name. The membership is evidenced by a dereferenceable member record.
  - aid: iit-madras:ror
    name: ROR registration (03v0r5n49)
    description: >-
      IIT Madras is registered in the Research Organization Registry as https://ror.org/03v0r5n49,
