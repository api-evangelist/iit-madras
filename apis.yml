x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    IIT Madras operates real machine-readable surfaces and publishes no contract for any of them.
    Three are institution-run and were confirmed live on 2026-09-01: the Shibboleth SAML identity
    provider at idp.iitm.ac.in, registered by INFED and visible in eduGAIN as entity 672697 with
    scope iitm.ac.in; the self-hosted Moodle at courses.iitm.ac.in, whose LTI 1.3 JWKS is served
    unauthenticated at HTTP 200 while its web-services REST server returns a structured invalidtoken
    exception; and the AI4Bharat Shoonya API, whose /task/, /annotation/ and /prediction/ resources
    all return HTTP 401 with a JSON detail body. The Shoonya drf-yasg docs page renders, but every
    machine-readable form of that specification — /swagger.json, /swagger.yaml,
    /swagger/?format=openapi — returns HTTP 500, so no contract could be harvested and none was
    invented.

    Nothing here is a vendor contract wearing an IIT Madras name. Two surfaces are genuine tenancies
    and are recorded as relationships rather than as institute contracts: the online-degree Discourse
    forum, which CNAMEs to iitm.hosted-by-discourse.com and returns 403 not-logged-in on every JSON
    route, and the IRINS research-profile instance at iitm.irins.org, which is behind a Cloudflare
    managed challenge — live-but-unreadable to a non-browser client, a limit of our probe rather than
    a finding about the institute. Two registry memberships are facts about the institution and are
    kept as such: Crossref member 49493 (prefix 10.70002) and ROR 03v0r5n49. DataCite returns zero
    providers and zero repositories for IIT Madras.

    The gaps are real and probed, not assumed. api.iitm.ac.in, data.iitm.ac.in, dspace.iitm.ac.in,
    ir.iitm.ac.in and repository.iitm.ac.in do not resolve. No OAI-PMH endpoint exists:
    cenlib.iitm.ac.in/oai and webopac.iitm.ac.in/oai/request?verb=Identify both 404, and
    irepose.iitm.ac.in — the DSpace-CRIS "Knowledge Repository at IIT Madras" still linked from the
    Central Library — is NXDOMAIN from IIT Madras's own authoritative nameservers, so the institute's
    institutional repository is currently off the air. The library discovery layer at
    webopac.iitm.ac.in is a live SirsiDynix Enterprise deployment on IIT Madras address space with no
    RSS or OAI output. www.iitm.ac.in answers 200 for unknown paths with the site homepage, so
    /sso, /terms-of-use, /sitemap.xml and /.well-known/security.txt are soft-404s; the previously
    recorded ProductPage pointer to https://www.iitm.ac.in/sso has been removed for exactly that
    reason.
