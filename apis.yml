apis:
  - aid: iit-madras:idp
    name: IIT Madras Shibboleth Identity Provider (INFED / eduGAIN)
    description: >-
      IIT Madras's own SAML 2.0 identity provider, entityID https://idp.iitm.ac.in/idp/shibboleth,
      registered by INFED (the INFLIBNET Access Management Federation) and published into eduGAIN as
      entity 672697 since 2018-11-02. The eduGAIN record carries both an IDPSSODescriptor and an
      AttributeAuthorityDescriptor, a shibmd scope of iitm.ac.in, and ECCS status 1. The entityID
      itself returns 403 to anonymous clients, so the authoritative machine-readable description is
      the federation aggregate rather than a per-entity metadata URL. This is the strongest
      institution-operated machine-readable surface in the profile and it was entirely absent from
      the June 2026 pass.
    humanURL: https://idp.iitm.ac.in/
    baseURL: https://idp.iitm.ac.in/idp/
    tags:
      - Identity Federation
      - SAML
      - Shibboleth
      - Single Sign-On
    properties:
      - type: IdentityFederation
        url: identity-federation/iit-madras-identity-federation.yml
      - type: Conformance
        url: conformance/iit-madras-conformance.yml
    x-operator: federation
    x-operator-basis: >-
      idp.iitm.ac.in resolves through waf01.iitm.ac.in to 103.158.42.45 — IIT Madras's own address
      space, the same front end that serves www.iitm.ac.in and cenlib.iitm.ac.in — with no CNAME onto
      a vendor identity platform. The IdP is the institution's; the federation carrying it is shared
      by definition.
  - aid: iit-madras:moodle-lti
    name: IIT Madras Moodle — LTI 1.3 platform and Moodle Web Services
    description: >-
      The institute's self-hosted Moodle at courses.iitm.ac.in. Its LTI 1.3 public JWKS at
      /mod/lti/certs.php returns HTTP 200 application/json with an RS256 signing key and no
      credentials required; the LTI Advantage token endpoint at /mod/lti/token.php is live and
      rejects unsigned requests; and the Moodle web-services REST server answers
      core_webservice_get_site_info with a structured invalidtoken exception, i.e. the API is enabled
      and every useful call is credentialed. No OpenAPI is published, and Moodle's own generic
      contract belongs to Moodle — it is deliberately not saved under this institution.
    humanURL: https://courses.iitm.ac.in/
    baseURL: https://courses.iitm.ac.in/
    tags:
      - Learning Management
      - LTI
      - Course Catalog
      - Moodle
    properties:
      - type: Authentication
        url: authentication/iit-madras-lti-platform.yml
      - type: CourseCatalog
        url: https://courses.iitm.ac.in/
      - type: Conformance
        url: conformance/iit-madras-conformance.yml
    x-operator: institution
    x-operator-basis: >-
      courses.iitm.ac.in is an IIT Madras hostname fronted by a Barracuda WAF
      (app981586.prod.cudawaas.com) with the origin behind it. A WAF is not a tenancy — there is no
      moodlecloud.com, Canvas or Blackboard host in the chain, and the deployment is the institute's
      own.
  - aid: iit-madras:shoonya
    name: Shoonya annotation platform API (AI4Bharat, IIT Madras)
    description: >-
      A Django REST Framework API operated by AI4Bharat, IIT Madras's language-AI centre, behind the
      Shoonya data-annotation platform. The API root returns a browsable JSON index of /task/,
      /annotation/ and /prediction/; each of those returns HTTP 401
      {"detail":"Authentication credentials were not provided."}. A drf-yasg documentation surface is
      live at /swagger/ ("Shoonya API Docs") and /redoc, but the generated specification at
      /swagger.json, /swagger.yaml and /swagger/?format=openapi all return HTTP 500 — the docs render
      and the machine-readable contract does not. Recorded as an institution-operated API with no
      retrievable specification rather than padded with one we do not have.
    humanURL: https://backend.shoonya.ai4bharat.org/swagger/
    baseURL: https://backend.shoonya.ai4bharat.org/
    tags:
      - Artificial Intelligence
      - Data Annotation
      - Natural Language Processing
      - Research
    properties:
      - type: Documentation
        url: https://backend.shoonya.ai4bharat.org/swagger/
      - type: SourceCode
        url: https://github.com/AI4Bharat/Shoonya-Backend
    x-operator: institution
    x-operator-basis: >-
      AI4Bharat is a centre of IIT Madras: its canonical website is ai4bharat.iitm.ac.in, on the
      institute's own registrable domain, and ai4bharat.org 301s to it. The service host
      backend.shoonya.ai4bharat.org is the centre's own domain, not a vendor's shared platform, and
      the source is published by the institute's own GitHub organisation, github.com/AI4Bharat.
      Recorded as institution with the domain caveat stated rather than silently upgraded.
  - aid: iit-madras:discourse
    name: IIT Madras Online Degree community forum (Discourse tenant)
    description: >-
      The discussion forum for the IIT Madras BS in Data Science and Applications programme, running
      on Discourse's hosted service. Discourse's JSON API is present at every route —
      /site.json, /latest.json and /categories.json all return application/json — but all three
      return HTTP 403 {"errors":["You need to be logged in to do that."]}, so the forum is a closed
      community rather than a public read surface. /srv/status returns 200 "ok". The content and the
      community are IIT Madras's; the contract is Discourse's and is not saved here.
    humanURL: https://discourse.onlinedegree.iitm.ac.in/
    baseURL: https://discourse.onlinedegree.iitm.ac.in/
    tags:
      - Community
      - Forum
      - Online Degree
    properties:
      - type: Website
        url: https://discourse.onlinedegree.iitm.ac.in/
    x-operator: tenant
    x-operator-basis: >-
      discourse.onlinedegree.iitm.ac.in CNAMEs to iitm.hosted-by-discourse.com (184.104.178.43) — an
      institution-specific hostname on Discourse's managed platform. Classic tenancy.
  - aid: iit-madras:irins
    name: IIT Madras research profiles (IRINS tenant)
    description: >-
      IIT Madras's instance of IRINS, the Indian Research Information Network System operated by the
      INFLIBNET Centre, linked from the Central Library as the institute's research-profile
      directory. The host is live but sits behind a Cloudflare managed challenge and returns HTTP 403
      "Just a moment..." to non-browser clients, so no ORCID or Scopus integration could be
      dereferenced from outside. The profiles and the publication records are IIT Madras's; the
      platform and its contract are INFLIBNET's.
    humanURL: https://iitm.irins.org/
    baseURL: https://iitm.irins.org/
    tags:
      - Research Repository
      - CRIS
      - Research Outputs
    properties:
      - type: ResearchRepository
        url: https://iitm.irins.org/
    x-operator: tenant
    x-operator-basis: >-
      iitm.irins.org is an institution-specific subdomain of irins.org, INFLIBNET's national research
      information platform shared by hundreds of Indian institutions. Linked from
      cenlib.iitm.ac.in.
  - aid: iit-madras:crossref
    name: Crossref membership (member 49493)
    description: >-
      IIT Madras is a Crossref member in its own right — member 49493, primary name "Indian Institute
      of Technology Madras", location Chennai, Tamil Nadu, India, DOI prefix 10.70002, 11 current
      DOIs as of 2026-09-01. This is a fact about the institution, recorded as a membership; the
      Crossref REST API contract is Crossref's and is not saved here.
    humanURL: https://www.crossref.org/
    baseURL: https://api.crossref.org/members/49493
    tags:
