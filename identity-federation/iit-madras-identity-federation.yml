  plus direct HTTP probes of https://idp.iitm.ac.in/ and its SAML metadata paths on 2026-09-01.
x-operator: federation
x-operator-basis: >-
  The entityID https://idp.iitm.ac.in/idp/shibboleth is on IIT Madras's own registrable domain and
  resolves through waf01.iitm.ac.in to 103.158.42.45, IIT Madras's own address space — the same
