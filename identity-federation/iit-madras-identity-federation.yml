notes: >-
  This is the strongest institution-operated, machine-readable surface IIT Madras has. It was absent
  from the June 2026 profile entirely. No SAML metadata document is copied into this repository,
  because the institution does not publish one at a fetchable URL — recording the eduGAIN/INFED
  registration is the honest ceiling here.
