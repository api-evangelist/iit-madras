  - date: '2026-09-01'
    rating: 2
    summary: >-
      Re-reviewed under the API Evangelist university pipeline, which settles WHO OPERATES each
      surface before saving anything. The 2026-06-03 finding of "no public developer portal or open
      API program" still holds, but "no surfaces" did not: IIT Madras operates a Shibboleth SAML
      identity provider registered by INFED and visible in eduGAIN since 2018 (entity 672697,
      entityID https://idp.iitm.ac.in/idp/shibboleth, scope iitm.ac.in); a self-hosted Moodle at
      courses.iitm.ac.in serving an unauthenticated LTI 1.3 JWKS and a live LTI Advantage token
      endpoint; and, through its AI4Bharat centre, a credentialed Django REST API behind the Shoonya
      annotation platform whose drf-yasg docs render but whose generated specification 500s. It is a
      Crossref member (49493, prefix 10.70002) and holds ROR 03v0r5n49; DataCite returns nothing.
      Two tenancies are recorded as relationships rather than institute contracts: the online-degree
      Discourse forum (CNAME iitm.hosted-by-discourse.com) and the IRINS research-profile instance at
      iitm.irins.org. Two corrections to the June pass: https://www.iitm.ac.in/sso is a SOFT-404 —
      www.iitm.ac.in returns HTTP 200 with the site homepage for any unknown path, so the previously
      recorded ProductPage pointer has been removed — and the institute's DSpace-CRIS institutional
      repository irepose.iitm.ac.in, still linked from the Central Library, is NXDOMAIN from IIT
      Madras's own authoritative nameservers. No specification was fabricated and no vendor contract
      was saved under this institution.
    endpoints:
